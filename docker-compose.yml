services:
  flickr:
    image: ${FLICKR_IMAGE:-ghcr.io/rk295/flickr-export-browser:latest}
    build: .
    container_name: flickr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/London}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # Directory containing one sub-folder per extracted Flickr export
      - ${DATA_DIR:-./data}:/data:ro
      - ./cache:/cache
