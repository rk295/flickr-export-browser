name: Release

# Pushing a tag like v1.2.3 builds a multi-arch image, pushes it to GitHub
# Container Registry (ghcr.io) and creates a GitHub release.
# GitHub only: Gitea Actions skips this job (no ghcr.io credentials there).

on:
  push:
    tags:
      - "v*"

jobs:
  image:
    name: Publish image and release
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}`

            ```sh
            docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ```
