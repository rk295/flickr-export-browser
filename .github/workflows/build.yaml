name: Build

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build image
        run: docker build -t flickr-export-browser:ci .
